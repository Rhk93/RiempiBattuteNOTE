<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riempi la Battuta</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Music&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf6ec;--card:#fff;--head:#2b2340;--acc:#ff7a45;--txt:#2b2340;--ok:#22a861;--bad:#e5484d;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--txt);transition:background .3s;padding-bottom:20px}
button{font-family:inherit;cursor:pointer;transition:transform .12s,box-shadow .2s,background .2s}
button:active{transform:scale(.95)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--head);color:#fff;box-shadow:0 4px 18px #0002}
h1{font-size:18px;margin:0;letter-spacing:.2px}
header div{display:flex;gap:8px;align-items:center}
#thBtn{font-size:18px;background:#ffffff22;border:0;border-radius:12px;width:42px;height:42px}
#tsBtn{font:800 18px Nunito;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:6px 14px;line-height:1;box-shadow:0 3px 10px #0003}
#tsBtn small{display:block;font-size:9px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.5px}
.panel{display:none;flex-wrap:wrap;gap:8px;padding:12px 16px;background:var(--card);box-shadow:0 8px 20px #0001}
.panel.open{display:flex}
#tsPanel button{font:800 16px Nunito;border:0;background:var(--bg);color:var(--txt);border-radius:12px;padding:8px 14px}
#tsPanel button.on{background:var(--acc);color:#fff}
#thPanel button{border:0;border-radius:14px;padding:0;width:92px;overflow:hidden;font:800 11px Nunito;box-shadow:0 2px 8px #0002}
#thPanel button i{display:flex;height:24px}#thPanel button i b{flex:1}
#thPanel button span{display:block;padding:5px 2px}
#thPanel button.on{box-shadow:0 0 0 3px var(--acc)}
nav{display:flex;gap:8px;padding:14px 16px 4px}
nav button{flex:1;font:800 15px Nunito;border:0;border-radius:14px;padding:12px;background:var(--card);color:var(--txt);box-shadow:0 2px 10px #0001}
nav button.on{background:var(--acc);color:#fff;box-shadow:0 4px 14px #0002}
.top{display:flex;align-items:center;gap:16px;margin:10px 16px;padding:14px 16px;background:var(--card);border-radius:var(--r);box-shadow:0 2px 12px #0001}
#pie{width:110px;height:110px;flex:none}
#info{flex:1;min-width:150px}
#info .big{font-size:18px;font-weight:800}
#rest{font-size:14px;opacity:.75;margin-top:2px}
#msg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9;max-width:92vw;padding:10px 16px;border-radius:14px;background:var(--head);color:#fff;font-weight:800;font-size:15px;box-shadow:0 8px 24px #0004;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
#msg.show{opacity:1}
#msg.bad{background:var(--bad)} #msg.ok{background:var(--ok)}
.hint{padding:2px 18px 6px;font-size:13px;opacity:.7}
#staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;padding:0 12px}
.bar{background:var(--card);border-radius:var(--r);border:2px solid transparent;box-shadow:0 2px 12px #0001;touch-action:manipulation;transition:border-color .2s,box-shadow .2s}
.bar.act{border-color:var(--acc);box-shadow:0 6px 20px #0002}
.bar.full{border-color:var(--ok)} .bar.over{border-color:var(--bad)}
.bar svg{width:100%;display:block;cursor:pointer}
#palBox{grid-column:1/-1;background:var(--card);border-radius:var(--r);padding:10px;box-shadow:0 6px 20px #0002;border:2px solid var(--acc)}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:3px 0}
.pal button{background:var(--bg);border:2px solid transparent;border-radius:12px;padding:3px 1px;font:700 9.5px Nunito;color:var(--txt);line-height:1.1}
.pal button.on{border-color:var(--acc);background:var(--card);box-shadow:0 3px 10px #0002}
.pal svg{width:30px;height:40px;display:block;margin:0 auto}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px}
.tools button{font:800 14px Nunito;border:0;border-radius:12px;padding:10px 14px;background:var(--card);color:var(--txt);box-shadow:0 2px 10px #0001}
.tools.mini{padding:6px 0 0}
.tools.mini button{background:var(--bg);box-shadow:none;padding:8px 12px}
#dotBtn.on{background:var(--acc);color:#fff}
.box{display:none;margin:10px 16px;padding:14px;border-radius:var(--r);background:var(--card);box-shadow:0 2px 12px #0001}
.box.on{display:block}
.pl{display:flex;gap:10px}
.pl>div{flex:1;border-radius:14px;padding:10px;text-align:center;background:var(--bg);border:2px solid transparent}
.pl>div.turn{border-color:var(--acc);background:var(--card);box-shadow:0 4px 14px #0002}
.pl input{width:100%;font:800 15px Nunito;border:0;background:transparent;text-align:center;color:var(--txt);outline:none}
.pl b{font-size:32px;display:block}
.srow{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:10px;flex-wrap:wrap;font-size:13px}
.srow button{font:800 13px Nunito;border:0;background:var(--bg);color:var(--txt);border-radius:10px;padding:7px 12px}
.srow button.on{background:var(--acc);color:#fff}
.cent{text-align:center;font-weight:800;margin-top:8px}
.lv{display:flex;gap:6px;margin-bottom:6px}
.lv button{font:800 14px Nunito;border:0;border-radius:12px;padding:9px 14px;background:var(--bg);color:var(--txt)}
.lv button.on{background:var(--acc);color:#fff}
.nums{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.nums button{font:800 15px Nunito;width:42px;height:42px;border-radius:12px;border:0;color:#fff;box-shadow:0 2px 6px #0002}
.nums button.on{outline:3px solid var(--txt);outline-offset:2px}
.nums button.sg{width:auto;height:auto;border:0;background:none;box-shadow:none;padding:2px 4px;font:600 13px Nunito;color:var(--txt);outline:none}
.nums button.sg.on{color:var(--acc);font-weight:800;text-decoration:underline}
.sec{font:900 14px Nunito;letter-spacing:.6px;margin:12px 0 2px;opacity:.85}.sec small{font-weight:700;letter-spacing:0;opacity:.7}
.consegna{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--bg);border-left:6px solid var(--acc)}
.ctag{display:inline-block;font:900 12px Nunito;letter-spacing:1px;background:var(--acc);color:#fff;border-radius:8px;padding:3px 9px;margin-bottom:6px}
#reqLine{font-size:17px;font-weight:800;line-height:1.3}
.consegna .chips span{background:var(--card);font-size:14px;padding:7px 12px;box-shadow:0 1px 4px #0001}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{font:800 12px Nunito;padding:6px 10px;border-radius:20px;background:var(--bg)}
.chips span.ok{background:var(--ok);color:#fff}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
footer{text-align:center;font-size:12px;opacity:.55;padding:10px}
</style>
</head>
<body>
<header><h1>🎵 Riempi la Battuta</h1><div><button id="thBtn">🎨</button><button id="tsBtn">4/4<small>tempo</small></button></div></header>
<div class="panel" id="thPanel"></div>
<div class="panel" id="tsPanel"></div>
<nav>
  <button id="exBtn">📚 Esercizi</button>
  <button id="sfBtn">⚔️ Sfida a due</button>
</nav>
<div class="box" id="exBox">
  <div class="lv" id="lvRow"></div>
  <div class="sec" id="exHead">ESERCITAZIONI <small>(difficoltà crescente)</small></div>
  <div class="nums" id="numRow"></div>
  <div id="exTitle" style="font-weight:800"></div>
  <div class="srow" id="songTools" style="justify-content:flex-start"><button id="songPlay">▶ Ascolta il motivo</button><button id="myPlay">🎧 Ascolta quello che hai scritto</button><button id="slowBtn">🐢 Lento</button><button id="helpBtn"></button><button id="ckBtn">✔ Correggi</button><button id="solBtn"></button><span id="songHint" style="font-size:13px;opacity:.8"></span></div>
  <div class="consegna"><div class="ctag">📋 CONSEGNA</div><div id="reqLine"></div><div class="chips" id="chips"></div></div>
</div>
<div class="box" id="sfida">
  <div class="pl"><div id="p0"><input id="n0"><b id="s0">0</b></div><div id="p1"><input id="n1"><b id="s1">0</b></div></div>
  <div class="srow">Vince chi arriva a: <button data-t="3">3</button><button data-t="5">5</button><button data-t="10">10</button> <button id="sNew">↺ Nuova sfida</button></div>
  <div class="cent" id="sMsg"></div>
</div>
<div id="msg"></div><span id="barLbl" hidden></span><span id="rest" hidden></span>
<div class="hint">1) Scegli una figura qui sotto · 2) Tocca il pentagramma all'altezza della nota che vuoi</div>
<div id="staff"></div>
<div id="palBox"><div class="pal" id="palN"></div><div class="pal" id="palR"></div>
<div class="tools mini">
  <button id="dotBtn">• Punto di valore</button>
  <button id="undo">↶ Annulla</button>
</div></div>
<div class="tools">
  <button id="clrBar">Svuota battuta</button>
  <button id="addBar">+ Battuta</button>
  <button id="play">▶ Ascolta</button>
  <button id="clrAll">🗑 Ricomincia</button>
</div>
<footer>Copyright © Ignazio Paolicelli</footer>

}

  const mk=(el,r)=>{el.innerHTML='';FIG.forEach(([b,n])=>{const bt=document.createElement('button');
    bt.className=S.sel.b===b&&S.sel.r===r?'on':'';
    const c=S.pc?(r?RESTCOL:PCOL[[0,1,2,3,4][FIG.findIndex(f=>f[0]==b)]]):INK;
    bt.innerHTML=`<svg viewBox="${r?'-20 50 40 60':'-14 46 40 60'}">${noteSVG(r?0:-1,r?4:1,b,S.dot,r,c)}</svg>${r?'Pausa di '+n.toLowerCase():n}${S.dot?' puntata':''}`;
    bt.onclick=()=>{S.sel={b,r};palette();ac();save()};el.appendChild(bt)})};
  mk(PB.querySelector('#palN'),false);mk(PB.querySelector('#palR'),true);PB.querySelector('#dotBtn').classList.toggle('on',S.dot);
}
function toggle(id,force){const p=$(id);p.classList.toggle('open',force===undefined?!p.classList.contains('open'):force)}
function renderTS(){$('tsBtn').innerHTML=`${S.num}/${S.den}<small>tempo</small>`;const p=$('tsPanel');p.innerHTML='';
  TS.forEach(([n,d])=>{const b=document.createElement('button');b.textContent=n+'/'+d;b.className=n==S.num&&d==S.den?'on':'';
    b.onclick=()=>{if(E.on){E.on=false;exRender()}S.num=n;S.den=d;toggle('tsPanel',false);msg('Tempo cambiato in '+n+'/'+d,'');save();render()};p.appendChild(b)})}
function render(){renderTS();renderStaff();renderPie();palette();if(E.on)exChips()}

/* ---- TEMI ---- */
function applyTH(n){const t=TH[n]||TH.Classico,r=document.documentElement.style;
  r.setProperty('--bg',t[0]);r.setProperty('--card',t[1]);r.setProperty('--head',t[2]);r.setProperty('--acc',t[3]);r.setProperty('--txt',t[4]);
  INK=t[4];S.theme=n;save();
  const p=$('thPanel');p.innerHTML='';
  Object.keys(TH).forEach(k=>{const c=TH[k],b=document.createElement('button');b.className=k===n?'on':'';
    b.innerHTML=`<i><b style="background:${c[2]}"></b><b style="background:${c[3]}"></b></i><span style="background:${c[0]};color:${c[4]}">${k}</span>`;
    b.onclick=()=>applyTH(k);p.appendChild(b)});
  render();}

/* ---- SFIDA ---- */
function sfRender(){$('sfida').classList.toggle('on',SF.on);$('sfBtn').classList.toggle('on',SF.on);
  [0,1].forEach(k=>{$('s'+k).textContent=SF.sc[k];$('p'+k).classList.toggle('turn',SF.t===k&&!SF.end);if(document.activeElement!==$('n'+k))$('n'+k).value=SF.names[k]});
  document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',+b.dataset.t===SF.tg));
  if(!SF.end)$('sMsg').textContent='Tocca a '+SF.names[SF.t]+': riempi la battuta!';save()}
function sfOk(){const k=SF.t;SF.sc[k]++;
  if(SF.sc[k]>=SF.tg){SF.end=true;$('sMsg').textContent='🏆 Ha vinto '+SF.names[k]+'! ('+SF.sc[0]+' a '+SF.sc[1]+')';fanfare()}
  else{SF.t=1-k;setTimeout(()=>msg('+1 punto a '+SF.names[k]+'! Ora tocca a '+SF.names[SF.t],'ok'),10)}
  sfRender()}
function sfErr(){if(SF.end)return;const k=SF.t;S.bars[S.act]=[];SF.t=1-k;
  setTimeout(()=>{msg('❌ Sbagliato! Battuta svuotata, tocca a '+SF.names[SF.t],'bad');render()},10);sfRender()}
function sfNew(){SF.sc=[0,0];SF.t=0;SF.end=false;S.bars=[[],[],[],[]];S.act=0;save();msg('Nuova sfida!','');render();sfRender()}

/* ---- ESERCIZI ---- */
function exData(){return exList(E.lv)[E.i]}
function exStart(lv,i){E.on=true;E.lv=lv;E.i=i;E.ok=false;let [ts,nb]=exData();E.sol=false;if(lv==='CANZONCINE'||lv==='DETTATO'){const c=exData();ts=c[1];TGT=parseSong(c[2]);nb=TGT.length}const [n,d]=ts.split('/').map(Number);
  S.num=n;S.den=d;S.bars=Array.from({length:nb},()=>[]);S.act=0;
  if(SF.on){SF.on=false;sfRender()}
  msg(lv==='CANZONCINE'?'🎶 '+CANZ[i][0]+': via!':'Esercizio '+(i+1)+': via!','');save();exRender();render()}
function exCounts(){const c={};S.bars.forEach(b=>b.forEach(n=>{const k=key(n);c[k]=(c[k]||0)+1}));return c}
function exChips(){$('exHead').style.display=isSong()?'none':'';$('songHint').style.display='none';
  $('reqLine').innerHTML=isSong()?`Ricopia nota per nota il motivo <u>${exData()[0]}</u>: scegli la figura giusta e tocca l'altezza giusta sul pentagramma.`:`Riempi le ${S.bars.length} battute in ${S.num}/${S.den} usando <u>ALMENO</u> queste figure:`;$('songTools').style.display=isSong()?'flex':'none';$('helpBtn').textContent=E.help?'👁 Aiuto: SÌ':'🙈 Aiuto: NO';['helpBtn'].forEach(id=>$(id).style.display=isDict()?'none':'');['slowBtn','ckBtn','solBtn'].forEach(id=>$(id).style.display=isDict()?'':'none');$('songHint').textContent=isDict()?'Ascolta e scrivi il motivo! Si parte da: '+(TGT[0]&&TGT[0][0]&&!TGT[0][0].r?NAMES[pn(TGT[0][0].p)]:'pausa')+' · '+TGT.length+' battute in '+S.num+'/'+S.den:'Copia il motivo nota per nota!';$('solBtn').textContent=E.sol?'🙈 Nascondi soluzione':'💡 Soluzione';if(isSong()){$('chips').innerHTML='';return}
  const req=exData()[2],c=exCounts();
  $('chips').innerHTML=Object.entries(req).map(([k,v])=>{const h=Math.min(c[k]||0,v);return `<span class="${h>=v?'ok':''}">${h>=v?'✓ ':''}${v} ${kplur(k,v)}${h>0&&h<v?' <small>('+h+' fatt'+(h>1?'e':'a')+')</small>':''}</span>`}).join('')}
function exCheck(){const C=cap();if(!S.bars.every(b=>tot(b)===C))return;
  if(isDict()){setTimeout(()=>msg('Battute piene! Premi ✔ Correggi','ok'),20);return}
  if(isSong()){const nw=S.bars.reduce((a,b)=>a+b.filter(n=>n.w).length,0);setTimeout(()=>{if(!nw){E.ok=true;E.done[E.lv+E.i]=1;msg('⭐ Motivo completato! Premi «Ascolta quello che hai scritto»','ok');fanfare()}else msg('Hai finito! '+nw+(nw>1?' note diverse':' nota diversa')+' dall\'originale (in rosso): ascolta e confronta!','bad');save();exRender()},20);return}
  const req=exData()[2],c=exCounts(),miss=Object.entries(req).filter(([k,v])=>(c[k]||0)<v);
  setTimeout(()=>{if(!miss.length){E.ok=true;E.done[E.lv+E.i]=1;msg('⭐ Esercizio superato! Bravissimo!','ok');fanfare();save();exRender()}
    else msg('Battute piene, ma mancano: '+miss.map(([k,v])=>(v-(c[k]||0))+' '+kname(k)).join(', ')+'. Premi Annulla e riprova!','bad')},20)}
function exRender(){$('exBox').classList.toggle('on',E.on);$('exBtn').classList.toggle('on',E.on);if(!E.on)return;
  $('lvRow').innerHTML='';['CANZONCINE'].forEach(lv=>{const b=document.createElement('button');b.textContent=lv==='CANZONCINE'?'🎶 CANZONCINE':lv==='DETTATO'?'🎧 DETTATO':lv;b.style.background=LVCOL[lv];
    b.className=lv===E.lv?'on':'';b.style.background='';b.onclick=()=>{SLO=E.lv!=='CANZONCINE';exStart(E.lv==='CANZONCINE'?'ESERCIZI':'CANZONCINE',0)};$('lvRow').appendChild(b)});
  if(isSong()){const t=document.createElement('button');t.textContent=(SLO?'▴ Chiudi elenco':'▾ Scegli la canzoncina')+' ('+CANZ.length+')';t.onclick=()=>{SLO=!SLO;exRender()};$('lvRow').appendChild(t)}
  $('numRow').style.display=isSong()&&!SLO?'none':'flex';
  $('numRow').innerHTML='';exList(E.lv).forEach((_,i)=>{const b=document.createElement('button');b.textContent=(isSong()?(i+1)+'. '+CANZ[i][0]:(i+1))+(E.done[E.lv+i]?' ⭐':'');
    b.className=(isSong()?'sg ':'')+(i===E.i?'on':'');if(!isSong())b.style.background=hue(i);b.onclick=()=>{SLO=false;exStart(E.lv,i)};$('numRow').appendChild(b)});
  const xd=exData(),ts=isSong()?xd[1]:xd[0],nb=isSong()?TGT.length:xd[1];$('exTitle').innerHTML=`<span style="color:${isSong()?LVCOL.CANZONCINE:hue(E.i)}">${isSong()?(isDict()?'🎧 ':'🎶 ')+xd[0]:'Esercizio '+(E.i+1)}</span> · tempo ${ts} · ${nb} battut${nb>1?'e':'a'}`+(E.ok?' · ⭐ Superato!':'');
  exChips()}

/* ---- PULSANTI ---- */
$('tsBtn').onclick=()=>toggle('tsPanel');
$('thBtn').onclick=()=>toggle('thPanel');

$('exBtn').onclick=()=>{if(E.on){E.on=false;save();exRender()}else exStart(E.lv,E.i)};
$('sfBtn').onclick=()=>{SF.on=!SF.on;if(SF.on){if(E.on){E.on=false;exRender()}sfNew()}else sfRender()};
$('sNew').onclick=sfNew;
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{SF.tg=+b.dataset.t;sfRender()});
[0,1].forEach(k=>$('n'+k).oninput=e=>{SF.names[k]=e.target.value||('Giocatore '+(k+1));save()});
PB.querySelector('#dotBtn').onclick=()=>{S.dot=!S.dot;palette();msg(S.dot?'Punto attivo: la figura vale una volta e mezza':'Punto tolto','');save()};
PB.querySelector('#undo').onclick=()=>{let i=S.act;if(!S.bars[i].length&&i>0)i--;S.act=i;S.bars[i].pop();E.ok=false;msg('','');save();render();if(E.on)exRender()};
$('clrBar').onclick=()=>{S.bars[S.act]=[];msg('Battuta svuotata','');save();render()};
$('addBar').onclick=()=>{S.bars.push([]);S.act=S.bars.length-1;save();render()};
$('clrAll').onclick=()=>{if(E.on){exStart(E.lv,E.i);return}S.bars=[[],[],[],[]];S.act=0;msg('Si ricomincia!','');save();render()};
$('play').onclick=()=>{const a=ac();let t=a.currentTime+.1;const u=0.6/8*(S.den==8?2:1);
  S.bars.forEach(b=>b.forEach(n=>{if(!n.r)tone(n.p,n.d*u*.97,t);t+=n.d*u}))};
const playT=k=>{const a=ac();let t=a.currentTime+.1;const u=k*0.6/8*(S.den==8?2:1);TGT.forEach(b=>b.forEach(n=>{if(!n.r)tone(n.p,n.d*u*.97,t);t+=n.d*u}))};
$('myPlay').onclick=()=>$('play').click();
$('slowBtn').onclick=()=>playT(1.7);
$('solBtn').onclick=()=>{E.sol=!E.sol;save();render()};
$('ckBtn').onclick=()=>{let g=0,tot2=0;TGT.forEach((tb,i)=>{const ub=S.bars[i]||[];tb.forEach((t,j)=>{tot2++;const n=ub[j];const ok=n&&n.b===t.b&&n.dot===t.dot&&n.r===t.r&&(t.r||n.p===t.p);if(n)n.ck=ok?2:1;if(ok)g++});ub.slice(tb.length).forEach(n=>n.ck=1)});
  if(g===tot2&&S.bars.every((b,i)=>b.length===(TGT[i]||[]).length)){E.ok=true;E.done[E.lv+E.i]=1;msg('⭐ Dettato perfetto! '+g+' su '+tot2,'ok');fanfare()}
  else msg('Giuste '+g+' su '+tot2+'. Le rosse sono sbagliate: correggi con Annulla e riprova!','bad');save();render();exRender()};
$('songPlay').onclick=()=>{const a=ac();let t=a.currentTime+.1;const u=0.6/8*(S.den==8?2:1);TGT.forEach(b=>b.forEach(n=>{if(!n.r)tone(n.p,n.d*u*.97,t);t+=n.d*u}))};
$('helpBtn').onclick=()=>{E.help=!E.help;save();render()};
if(E.lv==='CANZONCINE'||E.lv==='DETTATO')TGT=parseSong(CANZ[E.i][2]);
applyTH(S.theme);sfRender();exRender();
</script>
</body>
</html>
