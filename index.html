<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riempi la Battuta</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Music&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf6ec;--ink:#2b2340;--acc:#ff7a45;--ok:#2bb673;--bad:#e5484d;--card:#fff;--txt:#2b2340}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--txt)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--ink);color:#fff}
h1{font-size:19px;margin:0}
#tsBtn{font:800 18px Nunito;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:6px 14px;line-height:1}
#tsBtn small{display:block;font-size:10px;font-weight:600}
#thBtn{font-size:20px;background:none;border:0;margin-right:8px}
#thPanel{display:none;flex-wrap:wrap;gap:8px;padding:10px 14px;background:#fff;border-bottom:2px solid #eee}
#thPanel.open{display:flex}
#thPanel button{border:3px solid #fff;border-radius:12px;padding:8px 10px;font:800 12px Nunito;color:#fff;box-shadow:0 0 0 1px #ccc}
#thPanel button.on{box-shadow:0 0 0 3px #222}
#tsPanel{display:none;flex-wrap:wrap;gap:8px;padding:10px 14px;background:#fff;border-bottom:2px solid #eee}
#tsPanel.open{display:flex}
#tsPanel button{font:800 17px Nunito;border:2px solid var(--ink);background:#fff;border-radius:10px;padding:6px 12px}
#tsPanel button.on{background:var(--ink);color:#fff}
.top{display:flex;align-items:center;gap:14px;padding:12px 14px;flex-wrap:wrap}
#pie{width:150px;height:150px;flex:none}
#info{flex:1;min-width:160px}
#info .big{font-size:20px;font-weight:800}
#msg{min-height:24px;font-weight:800;margin-top:6px}
#msg.bad{color:var(--bad)} #msg.ok{color:var(--ok)}
#staff{display:flex;flex-wrap:wrap;padding:0 8px;gap:0}
.bar{flex:1 1 300px;max-width:520px;min-width:260px;background:var(--card);border-radius:10px;margin:4px;border:3px solid transparent;touch-action:manipulation}
.bar.act{border-color:var(--acc)} .bar.full{background:#eafaf1} .bar.over{background:#fdecec}
.bar svg{width:100%;display:block;cursor:pointer}
.hint{padding:4px 14px;font-size:14px;opacity:.75}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;padding:8px 14px}
.pal button{background:#fff;border:2px solid #ddd;border-radius:12px;padding:4px 2px;font:600 11px Nunito;color:var(--ink)}
.pal button.on{border-color:var(--acc);background:#fff1ea;box-shadow:0 0 0 2px var(--acc)}
.pal svg{width:40px;height:52px;display:block;margin:0 auto}
h3{margin:10px 14px 0;font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.tools button{font:800 15px Nunito;border:0;border-radius:12px;padding:10px 14px;background:var(--ink);color:#fff}
#dotBtn.on{background:var(--acc)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
footer{text-align:center;font-size:12px;opacity:.6;padding:16px}
</style>
</head>
<body>
<header><h1>🎵 Riempi la Battuta</h1><div><button id="thBtn">🎨</button><button id="tsBtn">4/4<small>tempo</small></button></div></header>
<div id="thPanel"></div>
<div id="tsPanel"></div>
<div class="top">
  <svg id="pie" viewBox="0 0 160 160"></svg>
  <div id="info"><div class="big" id="barLbl"></div><div id="rest"></div><div id="msg"></div></div>
</div>
<div class="hint">1) Scegli una figura qui sotto · 2) Tocca il pentagramma all'altezza della nota che vuoi</div>
<div id="staff"></div>
<h3>Note</h3><div class="pal" id="palN"></div>
<h3>Pause</h3><div class="pal" id="palR"></div>
<div class="tools">
  <button id="dotBtn">• Punto di valore</button>
  <button id="undo">↶ Annulla</button>
  <button id="clrBar">Svuota battuta</button>
  <button id="addBar">+ Battuta</button>
  <button id="play">▶ Ascolta</button>
  <button id="clrAll">🗑 Ricomincia</button>
</div>
<footer>Copyright © Ignazio Paolicelli</footer>
<script>
const FIG=[[32,'Semibreve'],[16,'Minima'],[8,'Semiminima'],[4,'Croma'],[2,'Semicroma']];
const TS=[[2,4],[3,4],[4,4],[5,4],[2,2],[3,8],[6,8],[9,8],[12,8]];
const NAMES=['Do','Re','Mi','Fa','Sol','La','Si'],SEMI=[0,2,4,5,7,9,11];
const COL=['#ff7a45','#4c8dff','#2bb673','#f5b700','#b36bff','#ff4f8b','#00b8c4','#8a6d3b'];
let S={num:4,den:4,bars:[[],[],[],[]],act:0,sel:{b:8,r:false},dot:false};
try{const s=JSON.parse(localStorage.getItem('riempiBattuta'));if(s&&s.bars)S=s}catch(e){}
const save=()=>{try{localStorage.setItem('riempiBattuta',JSON.stringify(S))}catch(e){}};
const cap=()=>S.num*32/S.den, tot=b=>b.reduce((a,n)=>a+n.d,0);
const Y=p=>98-6*p;
const $=id=>document.getElementById(id);

function noteSVG(x,p,b,dot,rest,col='#2b2340'){
  let s='',y=Y(p);
  if(rest){
    if(b==32)s=`<rect x="${x-8}" y="62" width="16" height="6" fill="${col}"/>`;
    else if(b==16)s=`<rect x="${x-8}" y="68" width="16" height="6" fill="${col}"/>`;
    else if(b==8)s=`<path d="M${x-3},60 l7,9 l-6,7 l7,9 c-7,-3 -10,1 -4,7" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round"/>`;
    else{s=`<line x1="${x+4}" y1="68" x2="${x-3}" y2="${b==4?92:98}" stroke="${col}" stroke-width="2.2"/><circle cx="${x-3}" cy="70" r="3" fill="${col}"/><path d="M${x-3},71 q5,2 7,-3" stroke="${col}" stroke-width="2" fill="none"/>`;
      if(b==2)s+=`<circle cx="${x-5}" cy="80" r="3" fill="${col}"/><path d="M${x-5},81 q5,2 7.5,-3" stroke="${col}" stroke-width="2" fill="none"/>`;}
    if(dot)s+=`<circle cx="${x+12}" cy="71" r="2.6" fill="${col}"/>`;
    return s;
  }
  if(p<=-2)s+=`<line x1="${x-12}" x2="${x+12}" y1="110" y2="110" stroke="${col}" stroke-width="1.5"/>`;
  if(p>=10)s+=`<line x1="${x-12}" x2="${x+12}" y1="38" y2="38" stroke="${col}" stroke-width="1.5"/>`;
  const fill=b<=8;
  s+=`<ellipse cx="${x}" cy="${y}" rx="7.5" ry="5.2" transform="rotate(-20 ${x} ${y})" fill="${fill?col:'#fff'}" stroke="${col}" stroke-width="${fill?1:2.2}"/>`;
  if(b<=16){const up=p<4,sx=up?x+6.6:x-6.6,sy=up?y-36:y+36;
    s+=`<line x1="${sx}" y1="${y}" x2="${sx}" y2="${sy}" stroke="${col}" stroke-width="1.8"/>`;
    const fl=b==4?1:b==2?2:0;
    for(let k=0;k<fl;k++){const fy=up?sy+k*8:sy-k*8;
      s+=up?`<path d="M${sx},${fy} c1,8 12,9 9,22 c0,-9 -5,-11 -9,-13z" fill="${col}"/>`
           :`<path d="M${sx},${fy} c1,-8 12,-9 9,-22 c0,9 -5,11 -9,13z" fill="${col}"/>`;}
  }
  if(dot)s+=`<circle cx="${x+13}" cy="${p%2===0?y-6:y}" r="2.6" fill="${col}"/>`;
  return s;
}

function renderStaff(){
  const C=cap(),el=$('staff');el.innerHTML='';
  S.bars.forEach((bar,i)=>{
    const first=i===0,lead=first?78:14,W=lead+270,t=tot(bar),den=Math.max(C,t);
    let s=`<svg viewBox="0 0 ${W} 150" data-i="${i}">`;
    for(let k=0;k<5;k++)s+=`<line x1="0" x2="${W}" y1="${50+12*k}" y2="${50+12*k}" stroke="#2b2340" stroke-width="1.3"/>`;
    s+=`<line x1="${W-1}" x2="${W-1}" y1="50" y2="98" stroke="#2b2340" stroke-width="2"/>`;
    if(first)s+=`<text x="2" y="104" font-family="Noto Music" font-size="72">𝄞</text><text x="58" y="72" font-size="26" font-weight="800" text-anchor="middle" font-family="Georgia,serif">${S.num}</text><text x="58" y="96" font-size="26" font-weight="800" text-anchor="middle" font-family="Georgia,serif">${S.den}</text>`;
    // guide beats
    for(let k=1;k<S.num;k++){const gx=lead+12+k/S.num*250;s+=`<line x1="${gx}" x2="${gx}" y1="44" y2="104" stroke="#ff7a45" stroke-opacity=".18" stroke-dasharray="3 3"/>`}
    let off=0;
    bar.forEach((n,j)=>{const x=lead+20+off/den*250,col=off+n.d>C?'#e5484d':COL[j%COL.length];
      s+=noteSVG(x,n.p,n.b,n.dot,n.r,col);
      if(!n.r){const d=n.p+2;s+=`<text x="${x}" y="140" font-size="11" text-anchor="middle" fill="${col}" font-weight="800">${NAMES[(d%7+7)%7]}</text>`}
      off+=n.d});
    s+='</svg>';
    const div=document.createElement('div');
    div.className='bar'+(i===S.act?' act':'')+(t===C?' full':'')+(t>C?' over':'');
    div.innerHTML=s;el.appendChild(div);
    const svg=div.firstChild;
    svg.addEventListener('pointerdown',e=>{
      const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
      const q=pt.matrixTransform(svg.getScreenCTM().inverse());
      if(first&&q.x<74){toggleTS(true);return}
      S.act=i;insert(i,Math.max(-2,Math.min(10,Math.round((98-q.y)/6))),div);
    });
  });
}

function arc(cx,cy,r,a0,a1){
  if(a1-a0>=0.9999)return `M${cx},${cy-r} A${r},${r} 0 1 1 ${cx-0.01},${cy-r}Z`;
  const p=a=>[cx+r*Math.sin(a*2*Math.PI),cy-r*Math.cos(a*2*Math.PI)],[x0,y0]=p(a0),[x1,y1]=p(a1);
  return `M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${a1-a0>.5?1:0} 1 ${x1},${y1}Z`;
}
function renderPie(){
  const C=cap(),bar=S.bars[S.act]||[],t=tot(bar);let s=`<circle cx="80" cy="80" r="66" fill="#fff" stroke="#2b2340" stroke-width="3"/>`,off=0;
  bar.forEach((n,j)=>{const a0=Math.min(off/C,1),a1=Math.min((off+n.d)/C,1);if(a1>a0)s+=`<path d="${arc(80,80,64,a0,a1)}" fill="${COL[j%COL.length]}"/>`;off+=n.d});
  for(let k=0;k<S.num;k++){const a=k/S.num*2*Math.PI;s+=`<line x1="80" y1="80" x2="${80+66*Math.sin(a)}" y2="${80-66*Math.cos(a)}" stroke="#2b2340" stroke-width="2"/>`;
    const m=(k+.5)/S.num*2*Math.PI;s+=`<text x="${80+52*Math.sin(m)}" y="${84-52*Math.cos(m)}" font-size="${S.num>9?10:13}" font-weight="800" text-anchor="middle" fill="#2b2340" opacity=".55">${k+1}</text>`}
  if(t>C)s+=`<circle cx="80" cy="80" r="66" fill="none" stroke="#e5484d" stroke-width="6"/>`;
  else if(t===C)s+=`<circle cx="80" cy="80" r="66" fill="none" stroke="#2bb673" stroke-width="6"/>`;
  $('pie').innerHTML=s;
  $('barLbl').textContent=`Battuta ${S.act+1} di ${S.bars.length} · ${S.num}/${S.den}`;
  $('rest').textContent=t>=C?(t===C?'Piena! ✔':'Troppe note!'):'Manca: '+decomp(C-t);
}
function decomp(r){const o=[];for(const[v,n]of FIG)while(r>=v){o.push(n);r-=v}return o.join(' + ')}

function msg(t,c){const m=$('msg');m.textContent=t;m.className=c||''}
function insert(i,p,div){
  const C=cap(),bar=S.bars[i],d=S.sel.b*(S.dot?1.5:1);
  if(tot(bar)+d>C){div.classList.remove('shake');void div.offsetWidth;div.classList.add('shake');
    msg(tot(bar)===C?'Battuta già piena! Passa alla prossima.':'Non ci sta! Manca solo: '+decomp(C-tot(bar)),'bad');renderPie();renderStaffAct();return}
  bar.push({b:S.sel.b,d,dot:S.dot,r:S.sel.r,p:S.sel.r?4:p});
  if(!S.sel.r)tone(p,0.35);
  if(tot(bar)===C){msg('🎉 Battuta completa!','ok');if(i===S.bars.length-1)S.bars.push([]);S.act=i+1}
  else msg(S.sel.r?'Pausa inserita':'Nota '+NAMES[((p+2)%7+7)%7],'');
  save();render();
}
function renderStaffAct(){document.querySelectorAll('.bar').forEach((b,k)=>b.classList.toggle('act',k===S.act))}

let AC;function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function freq(p){const d=p+2,o=Math.floor(d/7);return 440*Math.pow(2,(60+12*o+SEMI[(d%7+7)%7]-69)/12)}
function tone(p,len,at){try{const a=ac(),t=at||a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=freq(p);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+Math.max(.15,len));o.connect(g).connect(a.destination);o.start(t);o.stop(t+len+.05)}catch(e){}}

function palette(){
  const mk=(el,r)=>{el.innerHTML='';FIG.forEach(([b,n])=>{const bt=document.createElement('button');
    bt.className=S.sel.b===b&&S.sel.r===r?'on':'';
    bt.innerHTML=`<svg viewBox="${r?'-20 50 40 60':'-14 46 40 60'}">${noteSVG(r?0:-1,r?4:1,b,false,r)}</svg>${r?'Pausa di '+n.toLowerCase():n}`;
    bt.onclick=()=>{S.sel={b,r};palette();ac();save()};el.appendChild(bt)})};
  mk($('palN'),false);mk($('palR'),true);$('dotBtn').classList.toggle('on',S.dot);
}
function toggleTS(force){const p=$('tsPanel');p.classList.toggle('open',force===undefined?!p.classList.contains('open'):force)}
function renderTS(){$('tsBtn').innerHTML=`${S.num}/${S.den}<small>tempo</small>`;const p=$('tsPanel');p.innerHTML='';
  TS.forEach(([n,d])=>{const b=document.createElement('button');b.textContent=n+'/'+d;b.className=n==S.num&&d==S.den?'on':'';
    b.onclick=()=>{S.num=n;S.den=d;toggleTS(false);msg('Tempo cambiato in '+n+'/'+d,'');save();render()};p.appendChild(b)})}
function render(){renderTS();renderStaff();renderPie();palette()}

$('tsBtn').onclick=()=>toggleTS();
$('dotBtn').onclick=()=>{S.dot=!S.dot;palette();msg(S.dot?'Punto attivo: la figura vale una volta e mezza':'Punto tolto','');save()};
$('undo').onclick=()=>{let i=S.act;if(!S.bars[i].length&&i>0)i--;S.act=i;S.bars[i].pop();msg('','');save();render()};
$('clrBar').onclick=()=>{S.bars[S.act]=[];msg('Battuta svuotata','');save();render()};
$('addBar').onclick=()=>{S.bars.push([]);S.act=S.bars.length-1;save();render()};
$('clrAll').onclick=()=>{S.bars=[[],[],[],[]];S.act=0;msg('Si ricomincia!','');save();render()};
$('play').onclick=()=>{const a=ac();let t=a.currentTime+.1;const u=0.6/8*(S.den==8?2:1);
  S.bars.forEach(b=>b.forEach(n=>{if(!n.r)tone(n.p,n.d*u*.9,t);t+=n.d*u}))};
const TH={
'Classico':['#fdf6ec','#2b2340','#ff7a45','#2b2340'],
'Azzurro cielo':['#e6f4ff','#1e88e5','#ff9800','#0d3c61'],
'Celeste':['#eefaff','#4fc3f7','#0277bd','#01579b'],
'Azzurro polvere':['#eef3f8','#6b8fb3','#e57373','#2c3e50'],
'Turchese':['#e8fbfa','#00a8a8','#ff6f61','#064e4e'],
'Carta da zucchero':['#edf2fb','#7da0ca','#3a5a8c','#1d2f4f'],
'Blu royal':['#eef1ff','#2741c9','#ffb300','#14215f'],
'Blu navy':['#e9edf5','#14213d','#fca311','#14213d'],
'Blu notte':['#0b1530','#1c2e6b','#4fc3f7','#e3ecff'],
'Verde':['#eefaf0','#2e7d32','#ff7043','#1b3d1d'],
'Rosa':['#fff0f5','#d63384','#7b2cbf','#4a1030'],
'Scuro':['#1b1b22','#33334a','#ff7a45','#eeeeee']};
function applyTH(n){const t=TH[n]||TH.Classico,r=document.documentElement.style;
 r.setProperty('--bg',t[0]);r.setProperty('--ink',t[1]);r.setProperty('--acc',t[2]);r.setProperty('--txt',t[3]);
 S.theme=n;save();const p=$('thPanel');p.innerHTML='';
 Object.keys(TH).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className=k===n?'on':'';
  b.style.background=`linear-gradient(135deg,${TH[k][1]} 60%,${TH[k][2]})`;b.onclick=()=>applyTH(k);p.appendChild(b)})}
$('thBtn').onclick=()=>$('thPanel').classList.toggle('open');
applyTH(S.theme||'Classico');
render();
</script>
</body>
</html>
